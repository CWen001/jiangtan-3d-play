<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10252e">
<title>江滩夜话 · 在线试玩</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1b24;color:#e9e3d3;font-family:system-ui,"Microsoft YaHei",sans-serif}
#stage{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.overlay{position:fixed;inset:0;display:grid;place-content:center;padding:24px;text-align:center;background:#10252ef5;z-index:2}
.overlay[hidden]{display:none}.kicker{color:#a1c8c3;font-size:12px;letter-spacing:4px}h1{font-size:clamp(28px,6vw,54px);margin:12px 0}p{line-height:1.65;margin:8px 0;color:#adc0c3}button{min-width:170px;min-height:52px;border:1px solid #d38670;background:#a83a40;color:#fff6e6;font:600 18px system-ui;cursor:pointer;padding:12px 28px;border-radius:4px;margin:16px auto 4px}button:focus-visible{outline:3px solid #8ed5ce;outline-offset:4px}button:disabled{opacity:.6;cursor:wait}progress{width:min(420px,80vw);height:12px;margin:16px auto;accent-color:#8ac8be}#status{font-size:14px;max-width:620px;overflow-wrap:anywhere}small{display:block;color:#7e999e;line-height:1.6;margin-top:14px}#rotate{z-index:3;display:none}.phone{font-size:54px}
#welcome{place-content:safe end end;grid-template-columns:minmax(0,280px);text-align:left;overflow-y:auto;padding:clamp(16px,3vw,48px);background:linear-gradient(270deg,rgba(6,19,30,.88),transparent 40%),url('title-art.png') center/contain no-repeat #0b1b24}
#welcome button,#welcome progress{margin-left:0;max-width:100%}
#welcome h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#welcome p{font-size:14px}
#welcome small{font-size:12px}
#scores-open{background:#101210;border-color:#a6a69b;margin-top:8px}
#scores-dialog{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#101210;color:#e9e7dc;border:1px solid #a6a69b;padding:24px}#scores-dialog::backdrop{background:#000b}#scores-dialog h2{margin-top:0}#scores-dialog table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}#scores-dialog th,#scores-dialog td{text-align:left;padding:10px 6px;border-bottom:1px solid #343831}#scores-dialog form{text-align:right}#scores-dialog button{min-width:100px}@media(max-width:520px){#scores-dialog{padding:16px}#scores-dialog table{font-size:13px}#scores-dialog th,#scores-dialog td{padding:9px 3px}}
.credit{position:absolute;top:clamp(24px,8.7vh,78px);right:clamp(16px,3vw,48px);width:280px;display:grid;gap:16px}.signature{display:flex;align-items:center;justify-content:space-between;gap:20px}.signature img{width:112px;height:auto}.signature strong{font-size:40px;font-weight:600;letter-spacing:.03em;color:#e9e3d3}.credit a{display:block;border-top:1px solid #e9e3d366;padding-top:16px;font-size:20px;color:#e9e3d3;text-decoration:none}.credit a:hover{text-decoration:underline;text-underline-offset:5px}.credit a:focus-visible{outline:2px solid #8ed5ce;outline-offset:4px}
@media(max-height:460px){#welcome{grid-template-columns:minmax(0,220px)}#welcome>p:first-of-type{display:none}#welcome p{font-size:12px}#welcome small{font-size:11px}.credit{position:static;width:auto;order:-1;gap:8px;margin:0 0 14px}.signature img{width:90px}.signature strong{font-size:30px}.credit a{font-size:16px;padding-top:8px}}
@media(orientation:portrait){.touch #rotate{display:grid}}
@media(max-height:460px){h1{font-size:30px;margin:4px 0}.kicker{font-size:11px}p{font-size:13px;margin:3px 0}button{margin:10px auto 0}small{font-size:11px;margin-top:6px}}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" aria-label="江滩夜话游戏画面"></canvas></div>
<section id="welcome" class="overlay" aria-label="开始游戏">
<h1>Jiangtan</h1>
<p>0.4.1 轻松试玩 · 六类对手 · 十段主场</p>
<div class="credit">
  <div class="signature"><img src="cwen-mark.svg" alt="" aria-hidden="true" width="165" height="52"><strong>C.WEN</strong></div>
  <a href="mailto:cwen@hust.edu.cn">cwen@hust.edu.cn</a>
</div>
<p id="instructions">电脑：WASD 移动，J 连击，点 K 分支／长 K 蓄力，I 防御，L 抓投，I＋L 环境。</p>
<button id="start" type="button">开始游戏</button>
<button id="scores-open" type="button">通关排行榜</button>
<progress id="progress" hidden aria-label="游戏资源加载进度"></progress>
<p id="status" role="status" aria-live="polite">免登录 · 单人闯关 · 首次加载需要下载游戏资源</p>
<small>通关后自动匿名上传用时与最高连击至共享榜（ScoreDrop）。<br>手机请横屏；切换应用会暂停。需要 WebGL 2.0。</small>
</section>
<section id="rotate" class="overlay" aria-label="横屏提示"><div class="phone">↻</div><h1>请将手机横过来</h1><p>左手摇杆，右手拳脚。横屏后继续。</p></section>
<dialog id="scores-dialog" aria-labelledby="scores-title">
<h2 id="scores-title">通关排行榜 · 全球共享</h2>
<p id="scores-status" role="status" aria-live="polite"></p>
<table><thead><tr><th scope="col">名次</th><th scope="col">自动昵称</th><th scope="col">用时</th><th scope="col">最高连击</th></tr></thead><tbody id="scores-rows"></tbody></table>
<small>完整通关自动记录，用时越短排名越高。社区成绩，不保证防作弊。</small>
<form method="dialog"><button autofocus>关闭</button></form>
</dialog>
<noscript><div class="overlay">此游戏需要启用 JavaScript。</div></noscript>
<script src="index.js"></script>
<script>
'use strict';
const config={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":141762328,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const params=new URLSearchParams(location.search);
const touch=matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints>0 || params.get('touch')==='1';
document.documentElement.classList.toggle('touch',touch);
config.args=['--','--autostart'];
if(touch)config.args.push('--touch');
if(params.get('qa')==='1')config.args.push('--web-test');
const canvas=document.getElementById('canvas');
const engine=new Engine(config);
const start=document.getElementById('start');
const status=document.getElementById('status');
const progress=document.getElementById('progress');
let started=false;
const scoresDialog=document.getElementById('scores-dialog');
document.getElementById('scores-open').addEventListener('click',async()=>{
 scoresDialog.showModal();
 const message=document.getElementById('scores-status');
 const rows=document.getElementById('scores-rows');
 rows.replaceChildren();message.textContent='正在读取共享榜…';
 try{
  const response=await fetch('https://leaderboard-game.vercel.app/api/top?key=n6cifo4gnz&limit=10',{cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.scores)||data.scores.length>10)throw new Error('Invalid scores');
  for(const entry of data.scores){
   const match=/^(Dock-[A-F0-9]{6})_C([0-9]{1,6})$/.exec(entry.player);
   if(!match||match[0]!==entry.player||!Number.isInteger(entry.score)||entry.score<0||entry.score>86399000)continue;
   const ms=86400000-entry.score;
   const time=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');
   const row=document.createElement('tr');
   for(const value of [rows.children.length+1,match[1],time,Number(match[2])]){const cell=document.createElement('td');cell.textContent=String(value);row.append(cell);}
   rows.append(row);
  }
  message.textContent=rows.children.length?'前十名 · 自动起名，无需注册':'还没有通关记录，等你上榜。';
 }catch{message.textContent='榜单暂时连接不上，不影响游戏；稍后重新打开即可。';}
});
if(touch)document.getElementById('instructions').textContent='左侧摇杆：移动 / 外推奔跑；右侧按钮：拳脚、跳跃、蓄力、互动。';
function resize(){
 const rect=canvas.getBoundingClientRect();
 const scale=Math.min(devicePixelRatio||1,1280/rect.width,720/rect.height);
 canvas.width=Math.max(1,Math.round(rect.width*scale));
 canvas.height=Math.max(1,Math.round(rect.height*scale));
}
new ResizeObserver(resize).observe(document.getElementById('stage'));
window.addEventListener('resize',resize);
canvas.addEventListener('contextmenu',event=>event.preventDefault());
canvas.addEventListener('webglcontextlost',()=>{
 document.getElementById('welcome').hidden=false;
 status.textContent='图形上下文已中断，请重新载入游戏。';
 start.textContent='重新载入';start.disabled=false;
});
start.addEventListener('click',async()=>{
 if(started){location.reload();return;}
 const missing=Engine.getMissingFeatures({threads:false});
 if(missing.length){status.textContent='当前浏览器缺少：'+missing.join('、')+'。请尝试更新浏览器。';return;}
 started=true;start.disabled=true;start.textContent='正在加载';progress.hidden=false;
 status.textContent='正在下载资源并初始化 3D 场景…';
 // Fullscreen/orientation are best-effort; browser tabs may refuse either request.
 if(touch&&params.get('qa')!=='1'){
  try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape');}catch{}
 }
 resize();
 try{
  const pack=config.executable+'.pck';
  if(config.fileSizes[pack]>100*1024*1024){
   // GitHub caps individual files at 100 MiB; use Godot's native preload API.
   const bytes=new Uint8Array(config.fileSizes[pack]);
   const chunk=64*1024*1024;
   for(let offset=0,part=0;offset<bytes.length;offset+=chunk,part++){
    const response=await fetch(pack+'.part'+part);
    if(!response.ok)throw new Error('资源分片加载失败：'+response.status);
    const data=new Uint8Array(await response.arrayBuffer());
    if(data.length!==Math.min(chunk,bytes.length-offset))throw new Error('资源分片长度不匹配');
    bytes.set(data,offset);progress.max=bytes.length;progress.value=offset+data.length;
    status.textContent='加载资源 '+Math.round(progress.value/progress.max*100)+'%';
   }
   status.textContent='正在初始化 3D 场景…';
   await engine.preloadFile(bytes,pack);
   await engine.init(config.executable);
   await engine.start({args:['--main-pack',pack,...config.args]});
  }else await engine.startGame({onProgress(current,total){
   if(total>0){progress.max=total;progress.value=current;status.textContent='加载资源 '+Math.round(current/total*100)+'%';}
   else{progress.removeAttribute('value');status.textContent='正在初始化场景，请稍候…';}
  }});
  document.getElementById('welcome').hidden=true;canvas.focus();canvas.dataset.ready='true';
 }catch(error){
  console.error(error);status.textContent='启动失败：'+(error?.message||String(error));start.textContent='重新载入';start.disabled=false;
 }
});
</script>
</body>
</html>
